name: FarmWatch CI and Release
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PLUGIN_NAME: FarmWatch
  DOTNET_SDK_VERSION: 10.0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build bundled FarmWatch ASF UI
        run: bash ui/build-unified-ui.sh "$PWD/FarmWatch/www"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Run FarmWatch tests
        run: dotnet test FarmWatch.Tests -p:ContinuousIntegrationBuild=true --nologo

      - name: Build single-install FarmWatch plugin package
        run: |
          dotnet publish FarmWatch -c Release -o out/plugin -p:ContinuousIntegrationBuild=true --nologo
          mkdir -p out/plugin-package/www
          cp "out/plugin/${PLUGIN_NAME}.dll" out/plugin-package/
          cp LICENSE README.md FarmWatch/CONNECT.md out/plugin-package/
          cp -R FarmWatch/www/. out/plugin-package/www/
          test -f "out/plugin-package/${PLUGIN_NAME}.dll"
          if find out/plugin-package -type f -name "*.resources.dll" | grep -q .; then
            echo "Satellite resource assemblies must not be packaged: ASF recursively loads every DLL under plugins/."
            exit 1
          fi
          test -f out/plugin-package/www/index.html
          test -f out/plugin-package/www/farmwatch-mark.svg
          test -f out/plugin-package/www/BUILD-INFO.txt

      - name: Upload complete plugin package artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarmWatch-Plugin
          path: out/plugin-package/

      - name: Create and verify single-install release ZIP
        run: |
          mkdir -p out/release
          ( cd out/plugin-package && zip -qr ../release/FarmWatch.zip . )
          unzip -Z1 out/release/FarmWatch.zip > out/release/package-files.txt
          grep -qx 'FarmWatch.dll' out/release/package-files.txt
          grep -qx 'README.md' out/release/package-files.txt
          grep -qx 'CONNECT.md' out/release/package-files.txt
          grep -qx 'www/index.html' out/release/package-files.txt
          grep -qx 'www/farmwatch-mark.svg' out/release/package-files.txt
          grep -qx 'www/ASF-ui-LICENSE' out/release/package-files.txt
          if grep -Eq '^www/www/|^FarmWatch/www/' out/release/package-files.txt; then
            echo "Unexpected nested web directory in plugin ZIP."
            exit 1
          fi

      - name: Upload verified release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FarmWatch-Release-ZIP
          path: out/release/FarmWatch.zip

  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Validate release tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Release tags must be plain numeric .NET versions (for example, 2.0.0.2)."
            exit 1
          fi

      - name: Download verified release ZIP
        uses: actions/download-artifact@v4
        with:
          name: FarmWatch-Release-ZIP
          path: out/release

      - name: Apply release version to artifact name
        run: mv out/release/FarmWatch.zip "out/release/FarmWatch-${GITHUB_REF_NAME}.zip"

      - name: Attest plugin package
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/release/FarmWatch-${{ github.ref_name }}.zip

      - name: Publish FarmWatch GitHub release
        uses: ncipollo/release-action@v1
        with:
          artifacts: out/release/FarmWatch-${{ github.ref_name }}.zip
          artifactContentType: application/zip
          name: FarmWatch V${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          bodyFile: .github/RELEASE_TEMPLATE.md
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          prerelease: false
          draft: false
