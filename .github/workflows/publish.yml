name: FarmWatch CI and Release
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PLUGIN_NAME: FarmWatch
  DOTNET_SDK_VERSION: 10.0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build standalone ASF UI
        run: bash ui/build-unified-ui.sh "$PWD/out/asf-ui"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Run FarmWatch tests
        run: dotnet test FarmWatch.Tests -p:ContinuousIntegrationBuild=true --nologo

      - name: Build FarmWatch plugin package
        run: |
          dotnet publish FarmWatch -c Release -o out/plugin -p:ContinuousIntegrationBuild=true --nologo
          mkdir -p out/plugin-package
          cp "out/plugin/${PLUGIN_NAME}.dll" out/plugin-package/
          ( cd out/plugin/ && cp --parents ./*/${PLUGIN_NAME}.resources.dll ../plugin-package/ || : )
          cp LICENSE README.md FarmWatch/CONNECT.md out/plugin-package/
          test -f "out/plugin-package/${PLUGIN_NAME}.dll"
          if find out/plugin-package -maxdepth 1 -type d -name www | grep -q .; then
            echo "Plugin package must not contain the standalone UI."
            exit 1
          fi

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarmWatch-Plugin
          path: out/plugin-package/

      - name: Upload standalone ASF UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: FarmWatch-ASF-UI
          path: out/asf-ui/

  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Release tags must be plain numeric .NET versions (for example, 2.0.0.1)."
            exit 1
          fi

      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: FarmWatch-Plugin
          path: out/plugin

      - name: Download ASF UI artifact
        uses: actions/download-artifact@v4
        with:
          name: FarmWatch-ASF-UI
          path: out/asf-ui

      - name: Create and verify separate ZIP packages
        run: |
          cd out
          ( cd plugin && 7z a -tzip -mx7 "../FarmWatch-${GITHUB_REF_NAME}.zip" * )
          ( cd asf-ui && 7z a -tzip -mx7 "../FarmWatch-ASF-UI-${GITHUB_REF_NAME}.zip" * )
          unzip -Z1 "FarmWatch-${GITHUB_REF_NAME}.zip" > plugin-files.txt
          unzip -Z1 "FarmWatch-ASF-UI-${GITHUB_REF_NAME}.zip" > ui-files.txt
          grep -qx 'FarmWatch.dll' plugin-files.txt
          grep -qx 'CONNECT.md' plugin-files.txt
          grep -qx 'index.html' ui-files.txt
          grep -qx 'farmwatch-mark.svg' ui-files.txt
          if grep -Eq '(^|/)www/|farmwatch-mark.svg' plugin-files.txt; then
            echo "Standalone UI assets leaked into the plugin ZIP."
            exit 1
          fi

      - name: Attest plugin package
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/FarmWatch-${{ github.ref_name }}.zip

      - name: Attest standalone ASF UI package
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/FarmWatch-ASF-UI-${{ github.ref_name }}.zip

      - name: Publish FarmWatch GitHub release
        uses: ncipollo/release-action@v1
        with:
          artifacts: out/FarmWatch-${{ github.ref_name }}.zip,out/FarmWatch-ASF-UI-${{ github.ref_name }}.zip
          artifactContentType: application/zip
          name: FarmWatch V${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          bodyFile: .github/RELEASE_TEMPLATE.md
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          prerelease: false
          draft: false
