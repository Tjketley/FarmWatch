name: FarmWatch CI and Release
# Build, test, and package FarmWatch. Version tags publish ASF-compatible plugin releases.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PLUGIN_NAME: "FarmWatch"
  DOTNET_SDK_VERSION: 10.0

jobs:
  ui-skin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FarmWatch theme overlay
        uses: actions/checkout@v4
      - name: Checkout official ASF-ui source
        uses: actions/checkout@v4
        with:
          repository: JustArchiNET/ASF-ui
          ref: c2b00c774347d34f461d7168ca2e2ea6809abd0d
          path: upstream-asf-ui
      - name: Apply FarmWatch skin
        run: bash ./ui-skin/apply-theme.sh "$GITHUB_WORKSPACE/upstream-asf-ui"
      - name: Build themed ASF-ui
        working-directory: upstream-asf-ui
        run: |
          npm ci
          npm run deploy
      - name: Upload complete themed ASF web interface
        uses: actions/upload-artifact@v4
        with:
          name: FarmWatch-ASF-ui
          path: upstream-asf-ui/dist
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Verify .NET Core
        run: dotnet --info

      - name: Prepare for publishing
        run: dotnet restore

      - name: Run FarmWatch automated tests
        run: dotnet test FarmWatch.Tests -p:ContinuousIntegrationBuild=true --nologo

      - name: Build FarmWatch plugin
        run: |
          dotnet publish FarmWatch -c "Release" -o "out/generic" -p:ContinuousIntegrationBuild=true --nologo
          mkdir -p ./out/dist/${{ env.PLUGIN_NAME }}
          cp ./out/generic/${{ env.PLUGIN_NAME }}.dll ./out/dist/${{ env.PLUGIN_NAME }}
          ( cd ./out/generic/ ; cp --parents ./*/${{ env.PLUGIN_NAME }}.resources.dll ../dist/${{ env.PLUGIN_NAME }} || : )
          cp LICENSE ./out/dist/${{ env.PLUGIN_NAME }}/LICENSE
          cp README.md ./out/dist/${{ env.PLUGIN_NAME }}/README.md
          cp -R FarmWatch/www ./out/dist/${{ env.PLUGIN_NAME }}/www
          test -f ./out/dist/${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_NAME }}.dll
          test -f ./out/dist/${{ env.PLUGIN_NAME }}/www/index.html
          test -f ./out/dist/${{ env.PLUGIN_NAME }}/www/farmwatch-mark.svg

      - name: Generate FarmWatch documentation
        uses: docker://pandoc/core:3.1
        with:
          args: --metadata title="${{ env.PLUGIN_NAME }}" --standalone --columns 2000 -f markdown -t html --embed-resources --standalone -c ./github-pandoc.css -o ./out/dist/${{ env.PLUGIN_NAME }}/README.html README.md

      - name: Upload FarmWatch package
        uses: actions/upload-artifact@v4.0.0
        with:
          name: ${{ env.PLUGIN_NAME }}
          path: out/dist/${{ env.PLUGIN_NAME }}

  release:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    needs: [publish, ui-skin]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.1

      - name: Download ${{ env.PLUGIN_NAME }} artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: ${{ env.PLUGIN_NAME }}
          path: out/plugin

      - name: Download themed ASF web interface artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: FarmWatch-ASF-ui
          path: out/ui-dist

      - name: Validate ASF-compatible release tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]+(\\.[0-9]+){1,3}$ ]]; then
            echo "Release tags must be plain numeric .NET versions (for example, 2.0.0.1), without a leading v."
            exit 1
          fi

      - name: Create and verify release ZIPs
        run: |
          mkdir -p out
          test -f out/plugin/${{ env.PLUGIN_NAME }}.dll
          test -f out/plugin/www/index.html
          test -f out/ui-dist/index.html

          ( cd out/plugin && 7z a -tzip -mx7 ../${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip * )
          ( cd out/ui-dist && 7z a -tzip -mx7 "$GITHUB_WORKSPACE/out/FarmWatch-ASF-ui-${GITHUB_REF_NAME}.zip" * )

          unzip -Z1 out/${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip > out/plugin-files.txt
          grep -qx '${{ env.PLUGIN_NAME }}.dll' out/plugin-files.txt
          grep -qx 'LICENSE' out/plugin-files.txt
          grep -qx 'README.md' out/plugin-files.txt
          grep -qx 'www/index.html' out/plugin-files.txt
          grep -qx 'www/farmwatch-mark.svg' out/plugin-files.txt
          if grep -q '^FarmWatch/' out/plugin-files.txt; then
            echo "Unexpected nested FarmWatch directory in plugin ZIP"
            exit 1
          fi

          unzip -Z1 out/FarmWatch-ASF-ui-${{ github.ref_name }}.zip > out/ui-files.txt
          grep -qx 'index.html' out/ui-files.txt
          test -s out/${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip
          test -s out/FarmWatch-ASF-ui-${{ github.ref_name }}.zip

      - name: Generate plugin artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'out/${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip'

      - name: Generate themed ASF UI artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'out/FarmWatch-ASF-ui-${{ github.ref_name }}.zip'

      - name: Publish FarmWatch GitHub release
        uses: ncipollo/release-action@v1.13.0
        with:
          artifacts: out/${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip,out/FarmWatch-ASF-ui-${{ github.ref_name }}.zip
          artifactContentType: application/zip
          name: ${{ env.PLUGIN_NAME }} V${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          bodyFile: .github/RELEASE_TEMPLATE.md
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          prerelease: false
          draft: false
