<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FarmWatch · ArchiSteamFarm</title>
<style>
:root{color-scheme:dark;--bg:#101317;--panel:#191f25;--line:#2b343d;--text:#edf2f5;--muted:#9aa8b3;--accent:#8bc5a5;--warn:#e4bd72}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:900px;margin:0 auto;padding:38px 22px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:22px}
h1{font-size:28px;letter-spacing:-.04em;margin:0}h2{font-size:16px;margin:0 0 14px}.sub,.muted{color:var(--muted)}.version{font:12px ui-monospace,monospace;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metric{padding:15px;border:1px solid var(--line);border-radius:9px}.metric strong{display:block;font-size:19px;margin-top:5px}
.status{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#78848e}.dot.on{background:var(--accent)}
.bot{display:flex;justify-content:space-between;gap:15px;padding:13px 0;border-top:1px solid var(--line)}.bot:first-of-type{border-top:0}
.notice{border-left:3px solid var(--warn);padding:10px 13px;background:#28241c;color:#e6d5b2;border-radius:4px;font-size:13px}
button{background:#27342f;color:var(--text);border:1px solid #466553;padding:9px 13px;border-radius:7px;cursor:pointer}button:hover{background:#30453a}
@media(max-width:600px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><main>
<header class="top"><div><h1>FarmWatch</h1><div class="sub">Steam promotion monitoring for ArchiSteamFarm</div></div><div class="version" id="version">Loading…</div></header>
<section class="panel"><h2>Runtime overview</h2><div class="grid">
<div class="metric"><span class="muted">Global auto-claim</span><strong id="global">—</strong></div>
<div class="metric"><span class="muted">Operating mode</span><strong id="mode">—</strong></div>
</div><p class="notice" style="margin:16px 0 0">Safety first: auto-claim is disabled by default. Observe-only mode monitors eligible promotions without requesting Steam licences.</p></section>
<section class="panel"><h2>Managed bots</h2><div id="bots" class="muted">Loading bot status…</div></section>
<footer style="display:flex;justify-content:space-between;align-items:center;margin-top:18px"><span class="muted" id="updated">—</span><button id="refresh" type="button">Refresh status</button></footer>
</main>
<script>
const $=id=>document.getElementById(id);
async function load(){
 $('bots').textContent='Loading bot status…';
 try{
  const response=await fetch('/Api/FarmWatch/Status',{credentials:'same-origin',headers:{'Accept':'application/json'}});
  if(!response.ok)throw new Error('ASF returned HTTP '+response.status);
  const data=await response.json();
  $('version').textContent='v'+data.version;
  $('global').textContent=data.globalAutoClaimEnabled?'Enabled':'Disabled';
  $('mode').textContent=data.observeOnly?'Observe only':'Claim mode';
  $('bots').innerHTML='';
  if(!data.bots.length){$('bots').textContent='No FarmWatch-enabled bots are currently configured.';}
  for(const bot of data.bots){
   const row=document.createElement('div');row.className='bot';
   const name=document.createElement('strong');name.textContent=bot.name;
   const state=document.createElement('span');state.className='status';
   const dot=document.createElement('i');dot.className='dot'+(bot.connected?' on':'');
   const label=document.createElement('span');label.textContent=(bot.connected?'Connected':'Disconnected')+' · '+(bot.autoClaimEnabled?'Bot claim switch on':'Bot claim switch off');
   state.append(dot,label);row.append(name,state);$('bots').append(row);
  }
  $('updated').textContent='Updated '+new Date().toLocaleTimeString();
 }catch(error){$('bots').textContent='Could not load FarmWatch status: '+error.message;$('version').textContent='Status unavailable';}
}
$('refresh').addEventListener('click',load);load();
</script></body></html>
